<style>
/* =========================================================================
   SISTEMA DE DISEÑO (documentado en DESIGN.md)
   ========================================================================= */
:root {
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-num: 'Fraunces', Georgia, serif;
  --r-sm: 10px; --r: 16px; --r-lg: 22px; --r-pill: 999px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;

  /* Superficies */
  --bg: #F7F3EE; --bg-2: #F1EBE3; --card: #FFFDFA; --panel: #EFE8DE; --overlay: rgba(43, 36, 30, .38);
  /* Texto */
  --tx: #2B2724; --tx-2: #5F574F; --tx-3: #766C63;
  /* Bordes */
  --bd: #E8E0D5; --bd-2: #D9CEC0;
  /* Dorado (la firma de la app) */
  --gold: #B8924A; --gold-ink: #85642A; --gold-soft: #F3E9D2; --gold-line: #DCC48F;
  /* Estados */
  --ok: #2F7A55; --ok-soft: #E3F0E8; --warn: #96620F; --warn-soft: #F8EDD6; --bad: #AE4339; --bad-soft: #F7E3E0;
  /* Acento (cambia por temporada) */
  --acc: #2F6B4F; --acc-ink: #24543E; --acc-soft: #E3EEE7; --on-acc: #FFFFFF;
  /* Paleta de gráficas */
  --c1: #5B8A72; --c2: #C9A45C; --c3: #C27C88; --c4: #6C8EAD; --c5: #D9826B;
  --c6: #8E7CB0; --c7: #4E9A9A; --c8: #B5835A; --c9: #8A9A5B; --c10: #A3707A;
  --shadow: 0 1px 2px rgba(70, 52, 34, .05), 0 8px 24px rgba(70, 52, 34, .06);
  --shadow-up: 0 -6px 24px rgba(70, 52, 34, .08);
  --nav-h: 68px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #2A2622; --bg-2: #2F2B26; --card: #35302B; --panel: #403A34; --overlay: rgba(10, 8, 6, .55);
  --tx: #F4EEE6; --tx-2: #D2C8BC; --tx-3: #B0A597;
  --bd: #48413A; --bd-2: #585047;
  --gold: #D8B872; --gold-ink: #E3C88C; --gold-soft: #4A4031; --gold-line: #8C7442;
  --ok: #7CC4A0; --ok-soft: #2F4238; --warn: #E2B460; --warn-soft: #4A3E2A; --bad: #EE9A90; --bad-soft: #4E3330;
  --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 8px 24px rgba(0, 0, 0, .18);
  --shadow-up: 0 -6px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
/* Temporadas: solo cambia el acento, el resto se mantiene sereno */
[data-season="navidad"]   { --acc: #2F6B4F; --acc-ink: #24543E; --acc-soft: #E3EEE7; }
[data-season="anio"]      { --acc: #8C6A2C; --acc-ink: #6F5320; --acc-soft: #F3EAD6; }
[data-season="amor"]      { --acc: #A65A6C; --acc-ink: #844656; --acc-soft: #F6E4E8; }
[data-season="primavera"] { --acc: #4F7D5E; --acc-ink: #3D634A; --acc-soft: #E5EFE6; }
[data-season="verano"]    { --acc: #B05E48; --acc-ink: #8E4A38; --acc-soft: #F8E6DF; }
[data-season="otono"]     { --acc: #A5622F; --acc-ink: #844E25; --acc-soft: #F6E7D8; }
[data-season="cumple"]    { --acc: #9C7430; --acc-ink: #7A5A24; --acc-soft: #F5EBD5; }
[data-theme="dark"][data-season="navidad"]   { --acc: #8CC4A6; --acc-ink: #A9D6BD; --acc-soft: #2F443A; --on-acc: #17261F; }
[data-theme="dark"][data-season="anio"]      { --acc: #DDBE7C; --acc-ink: #E8CF98; --acc-soft: #4A4031; --on-acc: #2A2110; }
[data-theme="dark"][data-season="amor"]      { --acc: #E7A9B6; --acc-ink: #F0C0CA; --acc-soft: #4C3338; --on-acc: #2E1A1F; }
[data-theme="dark"][data-season="primavera"] { --acc: #9CC7A9; --acc-ink: #B6D8C0; --acc-soft: #33443A; --on-acc: #18271D; }
[data-theme="dark"][data-season="verano"]    { --acc: #EDA48F; --acc-ink: #F4BCAB; --acc-soft: #4D3630; --on-acc: #2E1712; }
[data-theme="dark"][data-season="otono"]     { --acc: #E5A672; --acc-ink: #EEBD92; --acc-soft: #4C3B2C; --on-acc: #2C1A0C; }
[data-theme="dark"][data-season="cumple"]    { --acc: #E0C27E; --acc-ink: #EBD39E; --acc-soft: #4A4031; --on-acc: #2A2110; }

/* ========================== Base ========================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--tx); font-family: var(--font-ui);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  transition: background-color .4s ease, color .4s ease;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select, textarea { font-size: 16px; } /* evita el zoom en iPhone */
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.serif { font-family: var(--font-num); font-optical-sizing: auto; }
.muted { color: var(--tx-2); } .faint { color: var(--tx-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0; font-weight: 500; }
h2.sec { font-family: var(--font-num); font-size: 19px; letter-spacing: -.01em; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.hide { display: none !important; }

/* ========================== Layout ========================== */
.shell { min-height: 100dvh; }
.side { display: none; }
.main { padding: calc(env(safe-area-inset-top) + var(--s4)) var(--s4) calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px); max-width: 1180px; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); min-height: 44px; }
.topbar h1 { font-family: var(--font-num); font-size: 24px; letter-spacing: -.01em; }
.grid { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); }
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; align-items: stretch;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 6px max(8px, env(safe-area-inset-left)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-right));
  background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--bd); box-shadow: var(--shadow-up);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 44px;
  background: none; border: 0; color: var(--tx-3); font-size: 12px; font-weight: 500; border-radius: 12px; transition: color .25s;
}
.nav-btn svg { width: 23px; height: 23px; }
.nav-btn[aria-current="page"] { color: var(--acc); }
.nav-btn[aria-current="page"] svg { stroke-width: 2.1; }
.fab {
  position: fixed; z-index: 31; right: max(18px, env(safe-area-inset-right)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);
  width: 60px; height: 60px; border-radius: 20px; border: 0; background: var(--acc); color: var(--on-acc);
  box-shadow: 0 10px 24px color-mix(in srgb, var(--acc) 35%, transparent), inset 0 0 0 1.5px var(--gold-line);
  display: grid; place-items: center; transition: transform .25s cubic-bezier(.2, .9, .3, 1.3), box-shadow .25s;
}
.fab:active { transform: scale(.94); }
.fab svg { width: 28px; height: 28px; }

@media (min-width: 640px) {
  .main { padding-left: var(--s5); padding-right: var(--s5); }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span-2, .span-3 { grid-column: span 2; }
}
@media (min-width: 1025px) {
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
  .side {
    display: flex; flex-direction: column; gap: var(--s2); position: sticky; top: 0; height: 100dvh; padding: var(--s5) var(--s4);
    border-right: 1px solid var(--bd); background: var(--bg-2);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
  .brand b { font-family: var(--font-num); font-weight: 500; font-size: 19px; }
  .side .nav-btn { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 14px; font-size: 15px; color: var(--tx-2); }
  .side .nav-btn[aria-current="page"] { background: var(--card); color: var(--acc); box-shadow: var(--shadow); }
  .side .add-side { margin-top: var(--s3); }
  .bottom { display: none; }
  .main { padding: var(--s6) var(--s6) var(--s7); }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s5); }
  .span-2, .span-lg-2 { grid-column: span 2; } .span-3 { grid-column: span 3; }
  .fab { bottom: 32px; right: 32px; }
}

/* ========================== Componentes ========================== */
.card { background: var(--card); border: 1px solid var(--bd); border-radius: var(--r-lg); padding: var(--s4) var(--s4); box-shadow: var(--shadow); min-width: 0; }
@media (min-width: 640px) { .card { padding: var(--s5); } }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3); margin-bottom: var(--s3); flex-wrap: wrap; }
.seg.sm { padding: 3px; border-radius: 13px; }
.seg.sm button { min-height: 34px; font-size: 13px; padding: 0 12px; white-space: nowrap; border-radius: 10px; }
.label { font-size: 13px; color: var(--tx-2); font-weight: 500; letter-spacing: .01em; }
.big { font-family: var(--font-num); font-size: 30px; font-weight: 500; letter-spacing: -.015em; line-height: 1.15; }
.mid { font-family: var(--font-num); font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 500;
  background: var(--panel); color: var(--tx-2); white-space: nowrap;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.gold { background: var(--gold-soft); color: var(--gold-ink); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 14px;
  border: 1px solid var(--bd-2); background: var(--card); color: var(--tx); font-weight: 500; font-size: 15px; transition: background .2s, transform .15s, border-color .2s;
}
.btn:hover { background: var(--bg-2); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--acc); border-color: transparent; color: var(--on-acc); box-shadow: inset 0 0 0 1px var(--gold-line); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--acc-ink); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--bd); background: var(--card); display: grid; place-items: center; color: var(--tx-2); }
.icon-btn svg { width: 20px; height: 20px; }
.row { display: flex; align-items: center; gap: var(--s3); }
.between { justify-content: space-between; }
.stack > * + * { margin-top: var(--s3); }
.divider { height: 1px; background: var(--bd); margin: var(--s4) 0; border: 0; }
.bar { height: 8px; border-radius: 99px; background: var(--panel); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--acc); width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.bar.ok > i { background: var(--ok); } .bar.warn > i { background: var(--gold); } .bar.bad > i { background: var(--bad); }

/* Campos */
.field { display: block; margin-bottom: var(--s4); }
.field > span { display: block; font-size: 13px; font-weight: 500; color: var(--tx-2); margin-bottom: 6px; }
.input, select.input, textarea.input {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--bd-2); background: var(--bg);
  transition: border-color .2s, box-shadow .2s; appearance: none; -webkit-appearance: none;
}
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--tx-3) 50%), linear-gradient(135deg, var(--tx-3) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent); }
.err { color: var(--bad); font-size: 13px; margin-top: 6px; min-height: 0; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--panel); }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 12px; background: transparent; font-size: 14px; font-weight: 500; color: var(--tx-2); transition: background .25s, color .25s; padding: 0 6px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--tx); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { min-height: 40px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--bd-2); background: var(--card); font-size: 14px; font-weight: 500; color: var(--tx-2); }
.chips button[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--acc-ink); }

/* Skeletons */
.sk { background: linear-gradient(90deg, var(--panel) 0%, var(--bg-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: sk 1.6s ease-in-out infinite; border-radius: 10px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ========================== Hero de temporada ========================== */
.hero {
  position: relative; overflow: hidden; border-radius: var(--r-lg); padding: var(--s5) var(--s4) var(--s4);
  background: linear-gradient(135deg, var(--card) 0%, color-mix(in srgb, var(--acc-soft) 70%, var(--card)) 100%);
  border: 1px solid var(--gold-line); box-shadow: var(--shadow); min-height: 168px; display: flex; align-items: flex-end;
}
.hero-text { position: relative; z-index: 2; max-width: 54%; }
.hero-text .when { font-size: 13px; color: var(--tx-2); font-weight: 500; }
.hero-text .when::first-letter { text-transform: uppercase; }
.hero-text h1 { font-family: var(--font-num); font-size: 27px; letter-spacing: -.015em; line-height: 1.15; margin: 2px 0 6px; }
.hero-text p { margin: 0; font-size: 14px; color: var(--tx-2); }
.scene { position: absolute; right: -6px; bottom: 0; width: min(50%, 300px); z-index: 1; pointer-events: none; }
@media (min-width: 640px) { .scene { width: min(46%, 320px); } .hero-text { max-width: 56%; } }
.scene svg, .scene img { width: 100%; height: auto; display: block; }
.scene img.mine { max-height: 150px; object-fit: contain; margin-left: auto; width: auto; max-width: 100%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.12)); }
.lights { position: absolute; left: 0; right: 0; top: 0; height: 34px; z-index: 2; pointer-events: none; }
.fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.fx i { position: absolute; top: -12px; display: block; will-change: transform, opacity; }
@media (min-width: 640px) { .hero { min-height: 190px; padding: var(--s6) var(--s5) var(--s5); } .hero-text h1 { font-size: 32px; } }

/* Animaciones suaves (se apagan en modo "quieto" o si el sistema pide menos movimiento) */
@keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes glow { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
@keyframes fall { 0% { transform: translate3d(0, -10px, 0); opacity: 0; } 10% { opacity: var(--o, .7); } 90% { opacity: var(--o, .7); } 100% { transform: translate3d(var(--dx, 10px), 230px, 0) rotate(var(--rot, 40deg)); opacity: 0; } }
@keyframes rise { 0% { transform: translate3d(0, 200px, 0) scale(.8); opacity: 0; } 15% { opacity: var(--o, .7); } 100% { transform: translate3d(var(--dx, 10px), -20px, 0) scale(1); opacity: 0; } }
@keyframes wag { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.bulb { animation: twinkle 3.6s ease-in-out infinite; }
.star { transform-box: fill-box; transform-origin: center; animation: glow 4s ease-in-out infinite; }
.tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 2.4s ease-in-out infinite; }
.pup-head { animation: breathe 5s ease-in-out infinite; }
.anim-in > * { animation: up .5s cubic-bezier(.2, .8, .2, 1) both; }
.anim-in > *:nth-child(2) { animation-delay: .04s; } .anim-in > *:nth-child(3) { animation-delay: .08s; }
.anim-in > *:nth-child(4) { animation-delay: .12s; } .anim-in > *:nth-child(5) { animation-delay: .16s; } .anim-in > *:nth-child(n+6) { animation-delay: .2s; }
[data-motion="quiet"] *, [data-motion="quiet"] *::before, [data-motion="quiet"] *::after { animation: none !important; transition-duration: .01s !important; }
[data-motion="quiet"] .fx { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
  .fx { display: none; }
}

/* ========================== Inicio ========================== */
.month { display: flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 2px; }
.month b { min-width: 128px; text-align: center; font-weight: 500; font-size: 15px; text-transform: capitalize; }
.month .icon-btn { border: 0; width: 40px; height: 40px; }
.kpi .big { margin-top: 4px; }
.kpi .sub { font-size: 13px; margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi.hero-kpi { background: linear-gradient(160deg, var(--card) 40%, var(--gold-soft) 140%); border-color: var(--gold-line); }
.kpis { display: grid; gap: var(--s3); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpis .hero-kpi { grid-column: span 2; }
@media (min-width: 1025px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s5); } .kpis .hero-kpi { grid-column: auto; } }
.kpis .card { padding: var(--s4); }
@media (min-width: 640px) { .kpis .card { padding: var(--s5); } }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; font-size: 14px; border: 1px solid; }
.alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--tx); }
.alert.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 25%, transparent); color: var(--tx); }
.alert b { font-weight: 600; }
.donut-wrap { position: relative; height: 210px; max-width: 260px; margin: 0 auto; }
.donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.legend { list-style: none; margin: var(--s4) 0 0; padding: 0; }
.legend li button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 6px; border: 0; background: none; border-radius: 10px; text-align: left; min-height: 44px; }
.legend li button:hover { background: var(--bg-2); }
.dot { width: 10px; height: 10px; border-radius: 4px; flex: none; }
.legend .n { margin-left: auto; text-align: right; }
.chart-box { position: relative; height: 230px; }
.mini-acc { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--bd); }
.mini-acc:last-child { border-bottom: 0; }
.ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--panel); }
.ind { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }

<script>
'use strict';
/* =========================================================================
   VIDA ADULTA :c — app (JS sin framework)

// ---------- Utilidades ----------

const money = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2 });
const fm = n => money.format(Number(n) || 0);
const fms = n => (n > 0 ? '+' : n < 0 ? '−' : '') + money.format(Math.abs(Number(n) || 0));

const pad = n => String(n).padStart(2, '0');

const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const mesTxt = m => { const [y, mm] = m.split('-'); return `${MESES[+mm - 1]} ${y}`; };

const store = {
  get(k, def) { try { const v = localStorage.getItem('va_' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// En la dona cada categoría toma un color distinto de la paleta según su lugar (1º, 2º…)

const I = {

  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',

  refresh: '<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/>', check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  msi: '<rect x="3" y="5" width="18" height="15" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M12 14h2M16 14h.5"/>',

const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

// ---------- Estado ----------
const S = {
  cfg: store.get('cfg', null),          // { url, token }

let apiLocal = null; // para pruebas locales (simulador): window.__apiLocal
try { apiLocal = window.__apiLocal || (window.parent !== window && window.parent.__apiLocal) || null; } catch (e) { apiLocal = null; }

const pref = { tema: store.get('tema', 'auto'), motion: store.get('motion', 'soft'), temporada: store.get('temporada', 'auto'), personaje: store.get('personaje', '') };

function aplicarTema() {

  if (cumple && md === cumple) return 'cumple';

  if (m === 11 || m === 12) return 'navidad';

  if (m === 2) return 'amor';

  if (m <= 8) return 'verano';

const TEMPORADAS = { auto: 'Automática', navidad: 'Navidad', anio: 'Año nuevo', amor: 'Amor y amistad', primavera: 'Primavera', verano: 'Verano', otono: 'Otoño', cumple: 'Cumpleaños' };
const FRASES = {
  navidad: 'Temporada de luces: que tus cuentas también brillen.', anio: 'Año nuevo, cuentas claras.', amor: 'Quiérete también en tus finanzas.',

// ---------- Escenas de temporada (ilustraciones originales) ----------
function perrito(acc) {
  // Perrito original: cara redonda crema, orejas caramelo, manchita y collar dorado.
  const extras = {
    navidad: `<g><rect x="35" y="27" width="50" height="9" rx="4.5" fill="#FFF8EF"/><path d="M38 29 Q48 2 78 9 Q93 13 99 30 Q90 21 80 22 Q70 22 82 29 Z" fill="#B4505A"/><circle cx="99" cy="31" r="5.5" fill="#FFF8EF"/></g>`,

function lucesHTML() {

  }

function particulas(t) {
  const tipos = {
    navidad: { n: 14, k: 'fall', f: () => `<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3" fill="#FFFFFF" opacity=".95"/></svg>` },

    amor: { n: 9, k: 'rise', f: () => `<svg width="12" height="11" viewBox="0 0 36 32"><path d="M18 32S0 22 0 10a9 9 0 0 1 18-3 9 9 0 0 1 18 3c0 12-18 22-18 22z" fill="#E8A6B4"/></svg>` },

}

// ---------- API ----------
const ERRS = {
  'Token inválido': 'La clave (TOKEN) no coincide. Revisa que la copiaste completa.',
  'Failed to fetch': 'No pude conectar con tu hoja. Revisa tu internet o la dirección del Web App.',
  'Load failed': 'No pude conectar con tu hoja. Revisa tu internet o la dirección del Web App.',
  'NetworkError when attempting to fetch resource.': 'No pude conectar con tu hoja. Revisa tu internet.'
};
const amable = e => ERRS[e && e.message] || (e && e.message) || 'Algo salió mal. Intenta de nuevo.';
const esRed = e => e && (e.name === 'TypeError' || /fetch|network|load failed/i.test(e.message || ''));
async function api(action, params = {}, cfg = S.cfg) {
  const body = JSON.stringify(Object.assign({ action, token: cfg && cfg.token }, params));
  let j;
  if (apiLocal) j = JSON.parse(await apiLocal(body));
  else {
    // text/plain evita el "preflight" de CORS que Apps Script no contesta
    const r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' });
    const txt = await r.text();
    try { j = JSON.parse(txt); } catch (e) { throw new Error(/<html/i.test(txt) ? 'Google pidió iniciar sesión: publica el Web App con acceso "Cualquier persona".' : 'Respuesta inesperada del servidor'); }
  }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j.data;
}

function guardarCache() {
  store.set('data', S.data);
  const keys = Object.keys(S.meses).sort().slice(-8); const m = {}; keys.forEach(k => m[k] = S.meses[k]); S.meses = m; store.set('meses', m);
}
async function sync(silencioso) {
  if (!S.cfg) return;
  S.cargando = true; if (!silencioso) render();
  try {
    await vaciarCola();
    const d = await api('sync', { mes: S.mes || undefined });
    S.data = d; if (!S.mes) S.mes = d.dashboard.mes;
    S.meses[d.dashboard.mes] = { dashboard: d.dashboard, movimientos: d.movimientos };
    guardarCache(); aplicarTema();
  } catch (e) {
    if (!esRed(e)) toast(amable(e), true);
  } finally { S.cargando = false; render(); }
}
async function vaciarCola() {
  while (S.cola.length) {
    const op = S.cola[0];
    try { await api(op.action, op.params); }
    catch (e) { if (esRed(e)) throw e; toast('No se pudo guardar un pendiente: ' + amable(e), true); }
    S.cola.shift(); store.set('cola', S.cola);
  }
}
async function ejecutar(action, params, optimista) {
  try {
    const r = await api(action, params);
    sync(true); return r;
  } catch (e) {
    if (esRed(e) && ['agregarMovimiento', 'editarMovimiento', 'eliminarMovimiento'].includes(action)) {
      S.cola.push({ action, params }); store.set('cola', S.cola);
      if (optimista) optimista();
      render(); toast('Sin conexión: se guardará al volver internet');
      return { pendiente: true };
    }
    throw e;
  }
}
addEventListener('online', () => sync(true));

const cuentas = () => (D().cuentas || []).filter(c => c.activa !== false);

function movsDelMes() {
  const dm = datosMes(); let l = dm ? dm.movimientos.slice() : [];
  const ids = new Set(l.map(m => m.id));
  S.cola.forEach(op => {
    const m = op.params.mov;
    if (op.action === 'agregarMovimiento' && m && m.fecha.slice(0, 7) === S.mes && !ids.has(m.id)) l.unshift(Object.assign({ pendiente: true }, m));
    if (op.action === 'editarMovimiento' && m) l = l.map(x => x.id === m.id ? Object.assign({ pendiente: true }, m) : x);
    if (op.action === 'eliminarMovimiento') l = l.filter(x => x.id !== op.params.id);
  });
  return l.sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0);
}

function bindPin() {
  let pin = '';
  const dots = $('#dots'), err = $('#p-err');
  const pintar = () => $$('#dots i').forEach((d, i) => d.classList.toggle('on', i < pin.length));
  const fallo = msg => { err.textContent = msg; dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); pin = ''; pintar(); };
  const listo = async () => {
    const modo = S.pinModo;
    if (modo === 'crear') { S.pinNuevo = pin; S.pinModo = 'confirmar'; render(); return; }
    if (modo === 'confirmar') {
      if (pin !== S.pinNuevo) { S.pinModo = 'crear'; render(); setTimeout(() => $('#p-err') && ($('#p-err').textContent = 'No coincidieron. Intenta otra vez.'), 0); return; }
      try { await api('crearPin', { pin }); }
      catch (e) {
        if (/Ya hay un PIN/.test(e.message)) { S.pinModo = 'entrar'; render(); setTimeout(() => $('#p-err') && ($('#p-err').textContent = 'Ya tienes un PIN: escríbelo para entrar.'), 0); return; }
        return fallo(amable(e));
      }
      await guardarPinLocal(pin); desbloquear(); return;
    }
    // entrar
    try { await api('verificarPin', { pin }); await guardarPinLocal(pin); desbloquear(); }
    catch (e) {
      if (esRed(e)) {
        const loc = store.get('pinLocal', null);
        if (loc && await sha(loc.salt + pin) === loc.hash) return desbloquear();
        return fallo(loc ? 'PIN incorrecto' : 'Necesitas internet la primera vez');
      }
      if (/Aún no hay PIN/.test(e.message)) { S.pinModo = 'crear'; render(); return; }
      fallo(amable(e));
    }
  };
  $$('.keypad [data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k; err.textContent = '';
    if (k === 'del') pin = pin.slice(0, -1);
    else if (k === 'salir') { if (S.pinModo === 'entrar') confirmar('¿Desconectar este dispositivo?', 'Tendrás que volver a pegar la dirección y el TOKEN.', 'Desconectar', desconectar); return; }
    else if (/\d/.test(k) && pin.length < 6) pin += k;
    pintar(); if (pin.length === 6) setTimeout(listo, 120);
  });
  document.onkeydown = e => { if (!S.locked) return; if (/^\d$/.test(e.key)) $(`.keypad [data-k="${e.key}"]`)?.click(); if (e.key === 'Backspace') $('.keypad [data-k="del"]')?.click(); };
}
async function guardarPinLocal(pin) { const salt = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())); store.set('pinLocal', { salt, hash: await sha(salt + pin) }); }
function desbloquear() { S.locked = false; S.pinModo = null; S.pinNuevo = null; document.onkeydown = null; render(); sync(!!S.data && !!S.data.dashboard); }

  if (document.hidden) S.ultimoOculto = Date.now();
  else if (S.cfg && !S.locked && S.ultimoOculto && Date.now() - S.ultimoOculto > 5 * 60 * 1000) { S.locked = true; S.pinModo = 'entrar'; cerrarCapa(); render(); }
  else if (S.cfg && !S.locked && S.ultimoOculto && Date.now() - S.ultimoOculto > 60 * 1000) sync(true);

// ---------- Formulario de movimiento ----------
function abrirForm(base, modo) {
  base = base || {};
  const msiRec = base.msiId ? (D().msi || []).find(x => x.id === base.msiId) : null;
  const F = {
    id: modo === 'editar' ? base.id : null, tipo: base.tipo || 'Gasto', monto: base.monto ? String(base.monto) : '',
    categoria: base.categoria || '', origen: base.origen || store.get('ultimaCuenta', (cuentas()[0] || {}).nombre || ''), destino: base.destino || '',
    fecha: base.fecha || hoyISO(), descripcion: base.descripcion || '', subcategoria: base.subcategoria || '', msiMeses: msiRec ? msiRec.meses : 0
  };
  const pintar = () => {
    const credito = (cuentaPor(F.origen) || {}).tipo === 'Crédito';
    const esTr = F.tipo === 'Transferencia', esPago = F.tipo === 'Pago tarjeta';
    const opts = (lista, sel) => lista.map(c => `<option value="${esc(c.nombre)}" ${sel === c.nombre ? 'selected' : ''}>${esc(c.nombre)}${c.ultimos4 ? ' · ' + esc(c.ultimos4) : ''}</option>`).join('');
    const origenes = esPago ? cuentas().filter(c => c.tipo !== 'Crédito') : cuentas();
    const destinos = esPago ? cuentas().filter(c => c.tipo === 'Crédito') : cuentas().filter(c => c.nombre !== F.origen);
    if (esPago && !destinos.some(c => c.nombre === F.destino)) F.destino = (destinos[0] || {}).nombre || '';
    if (esTr && (!F.destino || F.destino === F.origen)) F.destino = (destinos[0] || {}).nombre || '';
    if (esPago && !origenes.some(c => c.nombre === F.origen)) F.origen = (origenes[0] || {}).nombre || '';
    const mens = F.msiMeses && Number(F.monto) ? fm(Number(F.monto.replace(/,/g, '')) / F.msiMeses) : '';
    $('#form-body').innerHTML = `
      <div class="seg" role="group" aria-label="Tipo de movimiento">${['Gasto', 'Ingreso', 'Transferencia', 'Pago tarjeta'].map(t => `<button type="button" data-tipo="${t}" aria-pressed="${F.tipo === t}" aria-label="${t}">${{ 'Pago tarjeta': 'Pago TDC', Transferencia: 'Transferir' }[t] || t}</button>`).join('')}</div>
      <label class="sr-only" for="f-monto">Monto</label>
      <div class="amount"><span>$</span><input id="f-monto" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(F.monto)}"></div><div class="amount-line"></div>
      ${!esTr && !esPago ? `<div class="field"><span>Categoría</span><div class="cat-grid">${catsDe(F.tipo).map(c => `<button type="button" data-catsel="${esc(c.nombre)}" aria-pressed="${F.categoria === c.nombre}"><span class="e">${esc(c.icono)}</span>${esc(c.nombre)}</button>`).join('')}</div></div>` : ''}
      <label class="field"><span>${esPago ? 'Pagar desde' : esTr ? 'De la cuenta' : 'Cuenta'}</span><select class="input" id="f-origen">${opts(origenes, F.origen)}</select></label>
      ${esTr || esPago ? `<label class="field"><span>${esPago ? 'Tarjeta que pagas' : 'A la cuenta'}</span><select class="input" id="f-destino">${opts(destinos, F.destino)}</select></label>` : ''}
      ${F.tipo === 'Gasto' && credito ? `<div class="field"><span>¿Es a meses sin intereses?</span><div class="chips">${[0, 3, 6, 9, 12, 18, 24].map(n => `<button type="button" data-msi="${n}" aria-pressed="${F.msiMeses === n}">${n ? n + ' MSI' : 'No'}</button>`).join('')}</div>${mens ? `<div class="faint" style="font-size:13px;margin-top:6px">${F.msiMeses} mensualidades de ${mens}</div>` : ''}</div>` : ''}
      <div class="row" style="gap:10px;align-items:flex-start">
        <label class="field" style="flex:1"><span>Fecha</span><input class="input" id="f-fecha" type="date" value="${esc(F.fecha)}"></label>
        <label class="field" style="flex:1.4"><span>Descripción</span><input class="input" id="f-desc" maxlength="120" placeholder="Súper, cine…" value="${esc(F.descripcion)}"></label>
      </div>
      <details ${F.subcategoria ? 'open' : ''}><summary class="faint" style="cursor:pointer;font-size:14px;margin-bottom:10px">Más detalles</summary><label class="field"><span>Subcategoría (opcional)</span><input class="input" id="f-sub" maxlength="60" value="${esc(F.subcategoria)}"></label></details>
      <div class="err" id="f-err" role="alert"></div>`;
    $$('[data-tipo]').forEach(b => b.onclick = () => { leer(); F.tipo = b.dataset.tipo; if (!catsDe(F.tipo).some(c => c.nombre === F.categoria)) F.categoria = ''; F.msiMeses = 0; pintar(); });
    $$('[data-catsel]').forEach(b => b.onclick = () => { F.categoria = b.dataset.catsel; $$('[data-catsel]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#f-err').textContent = ''; });
    $$('[data-msi]').forEach(b => b.onclick = () => { leer(); F.msiMeses = +b.dataset.msi; pintar(); });
    $('#f-origen').onchange = () => { leer(); if ((cuentaPor(F.origen) || {}).tipo !== 'Crédito') F.msiMeses = 0; pintar(); };
    $('#f-monto').oninput = e => { const v = e.target.value.replace(/[^\d.,]/g, ''); if (v !== e.target.value) e.target.value = v; $('#f-err').textContent = ''; };
  };
  const leer = () => {
    const g = id => $(id) ? $(id).value : undefined;
    F.monto = g('#f-monto') ?? F.monto; F.origen = g('#f-origen') ?? F.origen; F.destino = g('#f-destino') ?? F.destino;
    F.fecha = g('#f-fecha') ?? F.fecha; F.descripcion = g('#f-desc') ?? F.descripcion; F.subcategoria = g('#f-sub') ?? F.subcategoria;
  };
  const titulo = modo === 'editar' ? 'Editar movimiento' : modo === 'duplicar' ? 'Duplicar movimiento' : 'Nuevo movimiento';
  abrirCapa(`<div class="sheet-h"><h2>${titulo}</h2><button class="icon-btn" data-close aria-label="Cerrar">${ic('x')}</button></div>
    <form id="f-mov" novalidate><div id="form-body"></div>
    <div class="form-actions">${modo === 'editar' ? '<button class="btn" type="button" data-close>Cancelar</button>' : '<button class="btn" type="button" id="f-otro">Guardar y otro</button>'}<button class="btn primary" type="submit">${ic('check')} Guardar</button></div></form>`, 'side-panel');
  pintar();
  if (!F.monto && matchMedia('(min-width: 640px)').matches) setTimeout(() => $('#f-monto') && $('#f-monto').focus(), 380);
  const guardar = async (otro) => {
    leer();
    const err = $('#f-err'); const monto = Number(String(F.monto).replace(/,/g, ''));
    if (!(monto > 0)) { err.textContent = 'Escribe un monto mayor a 0'; $('#f-monto').focus(); return; }
    if ((F.tipo === 'Gasto' || F.tipo === 'Ingreso') && !F.categoria) { err.textContent = 'Elige una categoría'; return; }
    if (!F.origen) { err.textContent = 'Elige una cuenta'; return; }
    if ((F.tipo === 'Transferencia' || F.tipo === 'Pago tarjeta') && (!F.destino || F.destino === F.origen)) { err.textContent = 'Elige una cuenta destino distinta'; return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(F.fecha)) { err.textContent = 'Elige una fecha'; return; }
    const mov = { id: F.id || nuevoId(), fecha: F.fecha, tipo: F.tipo, monto: Math.round(monto * 100) / 100, categoria: (F.tipo === 'Gasto' || F.tipo === 'Ingreso') ? F.categoria : '', subcategoria: F.subcategoria || '', origen: F.origen, destino: (F.tipo === 'Transferencia' || F.tipo === 'Pago tarjeta') ? F.destino : '', descripcion: F.descripcion || '', msiMeses: F.tipo === 'Gasto' && F.msiMeses ? F.msiMeses : 0 };
    $$('#f-mov button').forEach(b => b.disabled = true);
    try {
      await ejecutar(modo === 'editar' ? 'editarMovimiento' : 'agregarMovimiento', { mov });
      store.set('ultimaCuenta', F.origen);
      toast(modo === 'editar' ? 'Cambios guardados ✓' : 'Guardado ✓');
      if (otro) { F.id = null; F.monto = ''; F.descripcion = ''; F.subcategoria = ''; F.msiMeses = 0; pintar(); $$('#f-mov button').forEach(b => b.disabled = false); $('#f-monto').focus(); }
      else cerrarCapa();
    } catch (e) { err.textContent = amable(e); $$('#f-mov button').forEach(b => b.disabled = false); }
  };
  $('#f-mov').onsubmit = e => { e.preventDefault(); guardar(false); };
  $('#f-otro') && ($('#f-otro').onclick = () => guardar(true));
}

  const fila = x => `<div class="card"><div class="row between"><b style="font-weight:500">${esc(x.descripcion)}</b><span class="chip ${x.estado === 'Liquidada' ? 'ok' : 'gold'}">${esc(x.estado)}</span></div>

    <div class="bar" style="margin:12px 0 6px"><i data-w="${x.meses ? Math.min(100, x.pagadas / x.meses * 100) : 0}"></i></div>
    <div class="row between" style="font-size:14px"><span class="muted">${x.pagadas} de ${x.meses} · faltan ${x.faltan}</span><span class="num"><b style="font-weight:600">${fm(x.mensualidad)}</b> <span class="faint">/mes</span></span></div>

}
function bindConfig() {
  const segBind = (id, fn) => $$(`#${id} [data-v]`).forEach(b => b.onclick = () => { $$(`#${id} [data-v]`).forEach(x => x.setAttribute('aria-pressed', x === b)); fn(b.dataset.v); });
  segBind('s-tema', v => { pref.tema = v; store.set('tema', v); aplicarTema(); render(); });
  segBind('s-mot', v => { pref.motion = v; store.set('motion', v); aplicarTema(); });
  segBind('s-msi', async v => { try { await api('config', { clave: 'MSI_MODO', valor: v }); toast('Guardado ✓'); sync(true); } catch (e) { toast(amable(e), true); } });
  $('#s-temp').onchange = e => { pref.temporada = e.target.value; store.set('temporada', pref.temporada); aplicarTema(); toast('Temporada: ' + TEMPORADAS[temporadaActual()]); };
  $('#s-img').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => { const max = 360, k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k; cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); pref.personaje = cv.toDataURL('image/png'); store.set('personaje', pref.personaje); URL.revokeObjectURL(url); toast('Listo ✓ Mira tu Inicio'); render(); };
    img.src = url;
  };
  $('#s-img-x') && ($('#s-img-x').onclick = () => { pref.personaje = ''; store.del('personaje'); render(); });
  $('#s-nom-ok').onclick = async () => { try { await api('config', { clave: 'NOMBRE', valor: $('#s-nom').value.trim() }); toast('Guardado ✓'); sync(true); } catch (e) { toast(amable(e), true); } };
  $('#s-lock').onclick = () => { S.locked = true; S.pinModo = 'entrar'; render(); };
  $('#s-out').onclick = () => confirmar('¿Desconectar este dispositivo?', 'Tus datos siguen seguros en tu Google Sheet. Aquí se borra la conexión y la caché.', 'Desconectar', desconectar);
  $('#s-sync').onclick = () => { sync(true); toast('Actualizando…'); };
  $('#s-csv').onclick = exportarCSV;
  $('#s-pin').onclick = () => {
    abrirCapa(`<div class="sheet-h"><h2>Cambiar PIN</h2><button class="icon-btn" data-close aria-label="Cerrar">${ic('x')}</button></div>
      <label class="field"><span>PIN actual</span><input class="input num" id="pn-a" inputmode="numeric" maxlength="6" type="password" autocomplete="off"></label>
      <label class="field"><span>PIN nuevo (6 números)</span><input class="input num" id="pn-n" inputmode="numeric" maxlength="6" type="password" autocomplete="off"></label>
      <div class="err" id="pn-e"></div><button class="btn primary block" id="pn-ok">Cambiar</button>`, 'modal');
    $('#pn-ok').onclick = async () => {
      const a = $('#pn-a').value, n = $('#pn-n').value;
      if (!/^\d{6}$/.test(n)) { $('#pn-e').textContent = 'El PIN nuevo debe tener 6 números'; return; }
      try { await api('cambiarPin', { actual: a, nuevo: n }); await guardarPinLocal(n); cerrarCapa(); toast('PIN cambiado ✓'); } catch (e) { $('#pn-e').textContent = amable(e); }
    };
  };
}
function exportarCSV() {
  const l = movsDelMes();
  const q = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const filas = [['Fecha', 'Tipo', 'Monto', 'Categoría', 'Subcategoría', 'Cuenta origen', 'Cuenta destino', 'Descripción', 'MSI']]
    .concat(l.map(m => [fecha(m.fecha), m.tipo, Number(m.monto).toFixed(2), m.categoria, m.subcategoria, m.origen, m.destino, m.descripcion, m.msiId ? 'Sí' : '']));
  const csv = '﻿' + filas.map(f => f.map(q).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `movimientos-${S.mes}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('CSV descargado ✓');
}

// ---------- Capas (paneles, modales), confirmación propia y toasts ----------
let capaPrevFocus = null, capaId = 0;
function abrirCapa(html, tipo) {
  cerrarCapa(true);
  capaId++;
  capaPrevFocus = document.activeElement;
  const L = $('#layers');
  L.innerHTML = `<div class="scrim" data-close></div><div class="sheet ${tipo || ''}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  requestAnimationFrame(() => { $('.scrim', L)?.classList.add('on'); $('.sheet', L)?.classList.add('on'); });
  $$('[data-close]', L).forEach(b => b.addEventListener('click', () => cerrarCapa()));
  document.body.style.overflow = 'hidden';
  setTimeout(() => { const f = $('.sheet input:not([type=hidden]):not([type=file]), .sheet select, .sheet button', L); if (f && !matchMedia('(max-width: 639px)').matches) f.focus(); }, 60);
}
function cerrarCapa(inmediato) {
  const L = $('#layers'); if (!L.innerHTML) return;
  document.body.style.overflow = '';
  if (inmediato) { L.innerHTML = ''; return; }
  $('.scrim', L)?.classList.remove('on'); $('.sheet', L)?.classList.remove('on');
  const id = capaId; // si mientras tanto se abrió otra capa, no la borres
  setTimeout(() => { if (id !== capaId) return; L.innerHTML = ''; capaPrevFocus && capaPrevFocus.focus && capaPrevFocus.focus(); }, 320);
}
addEventListener('keydown', e => { if (e.key === 'Escape') cerrarCapa(); });
function confirmar(titulo, texto, boton, fn) {
  abrirCapa(`<div class="sheet-h"><h2>${esc(titulo)}</h2></div><p class="muted" style="margin-top:0">${esc(texto)}</p>
    <div class="row" style="margin-top:20px"><button class="btn" style="flex:1" data-close>Cancelar</button><button class="btn primary" style="flex:1;background:var(--bad);color:#fff;box-shadow:none" id="cf-ok">${esc(boton)}</button></div>`, 'modal');
  $('#cf-ok').onclick = () => { cerrarCapa(); fn(); };
}
function toast(msg, malo) {
  const t = document.createElement('div'); t.className = 'toast' + (malo ? ' bad' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, malo ? 4200 : 2200);
}

// ---------- Inicio de la app ----------
(function iniciar() {
  aplicarTema();
  if (S.data && S.data.dashboard) S.mes = S.data.dashboard.mes;
  else S.mes = hoyISO().slice(0, 7);
  if (S.cfg) {
    S.locked = true;
    S.pinModo = store.get('pinLocal', null) ? 'entrar' : null;
    // Pregunta al servidor si ya existe un PIN (por si es un dispositivo nuevo)
    if (!S.pinModo) api('init').then(d => { S.data = Object.assign({}, S.data || {}, d); S.pinModo = d.config.tienePin ? 'entrar' : 'crear'; if (S.locked) render(); }).catch(() => { S.pinModo = 'entrar'; if (S.locked) render(); });
  }
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
